type = "historical_defense_treaty"
members = ["CMR", "FRA"]
terms = "Signed at Yaoundé on 1974-02-21; the French government’s 2008 defense white paper lists it as a bilateral defense agreement, and the replacement partnership agreement was signed in 2009. Historical agreement record only; it does not create automatic OpenPower defense effects."

[[countries_treaties]]
