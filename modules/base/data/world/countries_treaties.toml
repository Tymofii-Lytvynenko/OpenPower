type = "historical_defense_treaty"
members = ["CHN", "PRK"]
terms = "The 1961 treaty requires immediate military and other assistance after an armed attack and remains in force unless the parties agree to amend or terminate it. China’s official 2001 record commemorates its 40th anniversary. Historical treaty membership only; no automatic OpenPower defense effects."

[[countries_treaties]]
