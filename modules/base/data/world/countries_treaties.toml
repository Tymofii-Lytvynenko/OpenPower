type = "historical_defense_treaty"
members = ["EGY", "IRQ", "JOR", "LBN", "SAU", "SYR", "YEM"]
terms = "The original seven contracting governments ratified the treaty; it entered into force on 1952-08-22. Article 2 provides for collective assistance after armed aggression, and Article 12 permits withdrawal after ten years with twelve months’ notice. Historical ratifying-party record only; no automatic OpenPower defense effects."

[[countries_treaties]]
