[[countries_treaties]]
id = "seato_manila_pact"
name = "Southeast Asia Collective Defense Treaty (Manila Pact)"
type = "consultative_defence_arrangement"
status = "active"
members = ["AUS", "FRA", "NZL", "PHL", "THA", "GBR", "USA"]
terms = "In force on 2001-01-01; the SEATO organization had dissolved in 1977. Pakistan's denunciation took effect in 1973 and it is excluded. Treaty obligations operate through constitutional processes; the United States understood Article IV(1) to cover communist aggression and required consultation for other attacks. The 1962 Rusk-Thanat Communique affirmed the United States' individual as well as collective commitment to Thailand under the Manila Pact; it was not a separate bilateral treaty. Historical record only; no automatic OpenPower defense effects."

