name = "France-Central African Republic Defense Agreement"
type = "historical_defense_treaty"
members = ["CAF", "FRA"]
terms = "The agreement was signed in 1960 with the Central African Republic, Congo and Chad; the French government records that Congo and Chad denounced it and that it remained in force only with the Central African Republic in its 2008 defense white paper. Historical agreement record only; no automatic OpenPower defense effects."

[[countries_treaties]]
id = "france_comoros_defense_cooperation"
name = "France-Comoros Defense Cooperation Agreement"
type = "historical_defense_treaty"
members = ["COM", "FRA"]
terms = "Signed in Paris on 1978-11-10; listed by the French government as a bilateral defense cooperation agreement in its 2008 defense white paper, and cited as a Comoros military agreement in a 2000 parliamentary review. Its exact 2001 status is inferred from these records; no termination before 2001 was located. Historical agreement record only; it is not represented as a mutual-defense guarantee and has no automatic OpenPower effects."

