name: Property tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/property -q --hypothesis-profile=ci
      - run: python -m pytest tests/property -q -m slow --hypothesis-profile=ci
